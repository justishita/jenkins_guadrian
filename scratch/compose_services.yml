  # --- Services added for CrewAI + Google ADK + A2A + MCP Architecture ---

  # Person 2 additions placeholder:
  # - otel-collector (OTLP 4317)
  # - jaeger (16686)
  # - mcp-prometheus

  # Person 3 additions placeholder:
  # - mcp-github

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      PORT: "9100"
      TRIGGER_MODE: ${TRIGGER_MODE:-a2a}
      A2A_SHARED_TOKEN: ${A2A_SHARED_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      JENKINS_AGENT_URL: http://jenkins-agent:9101
      METRICS_AGENT_URL: http://metrics-agent:9102
      CODE_AGENT_URL: http://code-agent:9103
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9100/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devnet

  mcp-jenkins:
    build:
      context: .
      dockerfile: mcp_servers/jenkins_mcp/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_USER: ${JENKINS_USER:-admin}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-admin_password}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      jenkins:
        condition: service_healthy
    networks:
      - devnet

  mcp-analytics:
    build:
      context: .
      dockerfile: mcp_servers/analytics_mcp/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - devnet
