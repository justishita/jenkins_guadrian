# Jenkins core rejects legacy CLI-over-remoting requests (remoting=true).
jenkins:
  systemMessage: "JenkinsGuardian local instance"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_URL}"
  # Local dev only: lets Prometheus scrape /prometheus without credentials.
  prometheusConfiguration:
    useAuthenticatedEndpoint: false

credentials:
  system:
    domainCredentials:
      - credentials:
          # Username + token (not Secret text): the GitHub branch scanner can only use this kind for API
          # access. As Secret text it silently scanned anonymously (60 requests/hour), so new branches
          # were found minutes late or not at all.
          - usernamePassword:
              scope: GLOBAL
              id: "github-ssh"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub token for branch scanning"
          - string:
              scope: GLOBAL
              id: "agent-webhook-secret"
              secret: "${WEBHOOK_SHARED_SECRET}"
              description: "Agent webhook shared secret"

jobs:
  - file: /var/jenkins_conf/jobs.groovy