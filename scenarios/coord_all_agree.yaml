id: coord-all-agree
name: All Three Agents Agree
owner: P2
agent: coordinator

# Required by the shared scenario schema; the Coordinator reads no incident metadata.
incident:
  job_name: target-app

scenario: >
  Jenkins, Metrics and Code all point at a timeout. Corroboration raises the fused score
  above any single vote, and the report is complete, unconflicted and ready for policy review.

truth: timeout

agents:
  jenkins_agent: {failure_type: timeout, confidence: 0.85}
  metrics_agent: {failure_type: timeout, confidence: 0.80}
  code_agent: {failure_type: timeout, confidence: 0.30}

expected:
  verdict: timeout
  confidence: 0.9205        # noisy-OR of 0.85x0.9, 0.80x0.8, 0.30x0.2
  completeness: complete
  missing_agents: []
  failed_agents: []
  conflict_status: none
  conflicting_types: []
  unclassified_pairs: []
  ranking: [timeout]
  ready_for_policy_review: true
  blocking: []
  negative: []
