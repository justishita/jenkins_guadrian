id: metrics-unrelated-earlier-cpu-spike
name: Fresh Latency, Earlier CPU Spike
owner: P2
agent: metrics_agent

scenario: >
  CPU spiked and recovered almost five minutes before the failure; separately, latency has
  just degraded. The two did not happen together, so the fresh latency anomaly must stay
  the top cause, not be absorbed as a symptom of the old CPU spike. Found in a live run.

incident:
  branch: main
  failed_stage: Test

metrics:
  cpu_rate:
    fault: {shape: spike, at: -285, duration: 60, level: 0.9}
  latency_p95:
    fault: {shape: step, at: -120, level: 2.0}

expected:
  status: completed
  failure_type: timeout
  min_confidence: 0.7
  max_confidence: 0.95
  # Ranked hypotheses: failure type, plus fragments that must appear in the hypothesis text.
  hypotheses:
    - failure_type: timeout
      mentions: [latency_p95]
    - failure_type: resource_exhaustion
      mentions: [cpu_rate, recovered, 'memory_rss stayed normal']
  # What the top hypothesis cites. Only the catalog metrics relevant to it, never arbitrary ones.
  supporting_evidence: [metric-latency_p95]
  contradicting_evidence: []
  # The query plan this scenario expects: how many queries, which PromQL (in order), and
  # whether each call succeeded.
  tool_calls:
    count: 4
    ok: [true, true, true, true]
    expected_promql:
      - 'up{job="target_app"}'
      - 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="target_app"}[1m])))'
      - 'rate(process_cpu_seconds{job="target_app"}[1m])'
      - 'process_memory_bytes{job="target_app"}'
  # The investigation window in seconds relative to the failure time. incident_start is null
  # when no metric evidence was produced, so there is no incident window to inspect.
  window:
    baseline_start: -900
    incident_start: -300
    end: 60
  must_not_mention: [coincides]
