id: coord-healthy-adequate-metrics
name: Metrics Looked Properly And Saw Nothing
owner: P2
agent: coordinator

# Required by the shared scenario schema; the Coordinator reads no incident metadata.
incident:
  job_name: target-app

scenario: >
  Jenkins says timeout but Metrics, with full declared coverage, saw healthy latency and
  resources. That is genuine evidence of absence, so it applies a bounded discount to the
  timeout score (0.15 x 0.8 relevance = 0.12) rather than overturning it.

truth: timeout

agents:
  jenkins_agent: {failure_type: timeout, confidence: 0.80}
  metrics_agent: {failure_type: unknown, confidence: 0.20, status: insufficient_evidence, coverage: 1.0}
  code_agent: {failure_type: unknown, confidence: 0.10}

expected:
  verdict: timeout
  confidence: 0.6336        # 0.72 x (1 - 0.12)
  completeness: complete
  missing_agents: []
  failed_agents: []
  conflict_status: none
  conflicting_types: []
  unclassified_pairs: []
  ranking: [timeout]
  ready_for_policy_review: true
  blocking: []
  negative:
    - {agent: metrics_agent, failure_type: timeout, kind: general_absence, status: applied}
