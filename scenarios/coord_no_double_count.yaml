id: coord-no-double-count
name: Same Observation Is Penalised Once
owner: P2
agent: coordinator

# Required by the shared scenario schema; the Coordinator reads no incident metadata.
incident:
  job_name: target-app

scenario: >
  Metrics has full coverage and also cites a latency metric as contradicting the timeout.
  The contradiction is the specific form of the same observation as "Metrics found nothing",
  so the general-absence discount is suppressed and the penalty is applied exactly once.

truth: timeout

agents:
  jenkins_agent: {failure_type: timeout, confidence: 0.80}
  metrics_agent:
    failure_type: unknown
    confidence: 0.20
    status: insufficient_evidence
    coverage: 1.0
    contradicts: {timeout: [metric-latency_p95]}
  code_agent: {failure_type: unknown, confidence: 0.10}

expected:
  verdict: timeout
  confidence: 0.6336
  completeness: complete
  missing_agents: []
  failed_agents: []
  conflict_status: none
  conflicting_types: []
  unclassified_pairs: []
  ranking: [timeout]
  ready_for_policy_review: true
  blocking: []
  negative:
    - {agent: metrics_agent, failure_type: timeout, kind: explicit_contradiction, status: applied}
    - {agent: metrics_agent, failure_type: timeout, kind: general_absence, status: suppressed_by_explicit}
