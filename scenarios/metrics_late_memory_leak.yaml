id: metrics-late-memory-leak
name: Late Memory Leak With Jitter
owner: P2
agent: metrics_agent

scenario: >
  Resident memory is flat, with the ordinary jitter of a running process, until about three
  minutes before the failure, then climbs from 80 MiB to 120 MiB and never comes back down.
  The agent must judge "keeps rising" on the stretch that is elevated now, not on the flat,
  jittery time before it: that jitter used to count against a leak that began late in the
  window, and the agent dismissed it as unknown (found by the Week 8 held-out evaluation).

incident:
  branch: main
  failed_stage: Test

metrics:
  memory_rss:
    noise: 524288
    fault: {shape: ramp, at: -190, until: 0, level: 125829120}

expected:
  status: completed
  failure_type: resource_exhaustion
  min_confidence: 0.6
  max_confidence: 0.95
  # Ranked hypotheses: failure type, plus fragments that must appear in the hypothesis text.
  hypotheses:
    - failure_type: resource_exhaustion
      mentions: [memory_rss, rose, 'cpu_rate stayed normal']
  # What the top hypothesis cites. Only the catalog metrics relevant to it, never arbitrary ones.
  supporting_evidence: [metric-memory_rss]
  contradicting_evidence: [metric-cpu_rate]
  # The query plan this scenario expects: how many queries, which PromQL (in order), and
  # whether each call succeeded.
  tool_calls:
    count: 4
    ok: [true, true, true, true]
    expected_promql:
      - 'up{job="target_app"}'
      - 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="target_app"}[1m])))'
      - 'rate(process_cpu_seconds{job="target_app"}[1m])'
      - 'process_memory_bytes{job="target_app"}'
  # The investigation window in seconds relative to the failure time. incident_start is null
  # when no metric evidence was produced, so there is no incident window to inspect.
  window:
    baseline_start: -900
    incident_start: -300
    end: 60
  next_steps_mention: [CPU/memory limits]
