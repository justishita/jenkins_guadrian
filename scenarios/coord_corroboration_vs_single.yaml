id: coord-corroboration-vs-single
name: Two Weak Agreeing Agents Against One Stronger
owner: P2
agent: coordinator

# Required by the shared scenario schema; the Coordinator reads no incident metadata.
incident:
  job_name: target-app

scenario: >
  Jenkins and Metrics each give a modest timeout vote from independent evidence domains;
  Code gives one stronger config_error vote. The scenario is labelled timeout (independent
  corroboration should beat one stronger source) - an author's judgement, stated here so
  the fusion-method comparison can be read critically.

truth: timeout

agents:
  jenkins_agent: {failure_type: timeout, confidence: 0.50}
  metrics_agent: {failure_type: timeout, confidence: 0.50}
  code_agent: {failure_type: config_error, confidence: 0.65}

expected:
  verdict: timeout
  confidence: 0.67
  completeness: complete
  missing_agents: []
  failed_agents: []
  conflict_status: none
  conflicting_types: []
  unclassified_pairs: []
  ranking: [timeout, config_error]
  ready_for_policy_review: true
  blocking: []
  negative: []
