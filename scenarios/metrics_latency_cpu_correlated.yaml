id: metrics-latency-cpu-correlated
name: Latency And CPU Together
owner: P2
agent: metrics_agent

scenario: >
  CPU saturates and request latency climbs at the same moment while memory stays normal.
  The agent should report one resource-exhaustion cause that cites latency as a symptom,
  not two competing causes, and note that memory does not corroborate it.

incident:
  branch: main
  failed_stage: Test

metrics:
  latency_p95:
    fault: {shape: step, at: -120, level: 2.0}
  cpu_rate:
    fault: {shape: step, at: -120, level: 0.9}

expected:
  status: completed
  failure_type: resource_exhaustion
  min_confidence: 0.85
  max_confidence: 0.97
  # Ranked hypotheses: failure type, plus fragments that must appear in the hypothesis text.
  hypotheses:
    - failure_type: resource_exhaustion
      mentions: [cpu_rate, 'coincides with elevated latency_p95', 'memory_rss stayed normal']
  # What the top hypothesis cites. Only the catalog metrics relevant to it, never arbitrary ones.
  supporting_evidence: [metric-cpu_rate, metric-latency_p95]
  contradicting_evidence: [metric-memory_rss]
  # The query plan this scenario expects: how many queries, which PromQL (in order), and
  # whether each call succeeded.
  tool_calls:
    count: 4
    ok: [true, true, true, true]
    expected_promql:
      - 'up{job="target_app"}'
      - 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="target_app"}[1m])))'
      - 'rate(process_cpu_seconds{job="target_app"}[1m])'
      - 'process_memory_bytes{job="target_app"}'
  # The investigation window in seconds relative to the failure time. incident_start is null
  # when no metric evidence was produced, so there is no incident window to inspect.
  window:
    baseline_start: -900
    incident_start: -300
    end: 60
  next_steps_mention: [CPU/memory limits]
  must_not_mention: [slow endpoints]
