id: metrics-target-down
name: Target Down
owner: P2
agent: metrics_agent

scenario: >
  The service stops responding two minutes before the failure: availability drops to 0 and
  the other metric series simply stop. Missing data here is explained by the outage, not a
  reason to give up.

incident:
  branch: main
  failed_stage: Deploy

metrics:
  target_availability:
    fault: {shape: step, at: -120, level: 0.0}
  latency_p95:
    fault: {shape: stops, at: -120}
  cpu_rate:
    fault: {shape: stops, at: -120}
  memory_rss:
    fault: {shape: stops, at: -120}

expected:
  status: completed
  failure_type: infra_network_failure
  min_confidence: 0.6
  max_confidence: 0.95
  # Ranked hypotheses: failure type, plus fragments that must appear in the hypothesis text.
  hypotheses:
    - failure_type: infra_network_failure
      mentions: [target_availability, down]
  # What the top hypothesis cites. Only the catalog metrics relevant to it, never arbitrary ones.
  supporting_evidence: [metric-target_availability]
  contradicting_evidence: []
  # The query plan this scenario expects: how many queries, which PromQL (in order), and
  # whether each call succeeded.
  tool_calls:
    count: 4
    ok: [true, true, true, true]
    expected_promql:
      - 'up{job="target_app"}'
      - 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="target_app"}[1m])))'
      - 'rate(process_cpu_seconds{job="target_app"}[1m])'
      - 'process_memory_bytes{job="target_app"}'
  # The investigation window in seconds relative to the failure time. incident_start is null
  # when no metric evidence was produced, so there is no incident window to inspect.
  window:
    baseline_start: -900
    incident_start: -300
    end: 60
  next_steps_mention: [reachable]
