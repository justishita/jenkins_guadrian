name: Remediation Draft PR Workflow

on:
  push:
    branches:
      - 'ai-fix/**'
  workflow_dispatch:
    inputs:
      incident_id:
        description: 'UUID of the incident'
        required: true
        type: string
      attempt:
        description: 'Remediation attempt number (>= 0)'
        required: true
        default: '0'
        type: string
      base_branch:
        description: 'Base branch for the pull request'
        required: false
        default: 'main'
        type: string

jobs:
  validate-and-draft-pr:
    name: Verify & Create Draft PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Branch Name Format
        id: branch_check
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF_NAME="ai-fix/${{ inputs.incident_id }}-${{ inputs.attempt }}"
          fi
          echo "Checking branch name: $REF_NAME"
          if [[ ! "$REF_NAME" =~ ^ai-fix/[0-9a-fA-F-]{36}-[0-9]+$ ]]; then
            echo "::error::Branch name '$REF_NAME' does not match required pattern 'ai-fix/<incident_id>-<attempt>'"
            exit 1
          fi
          INCIDENT_ID=$(echo "$REF_NAME" | sed -E 's|^ai-fix/([0-9a-fA-F-]+)-[0-9]+$|\1|')
          ATTEMPT=$(echo "$REF_NAME" | sed -E 's|^ai-fix/[0-9a-fA-F-]+-([0-9]+)$|\1|')
          echo "incident_id=$INCIDENT_ID" >> $GITHUB_OUTPUT
          echo "attempt=$ATTEMPT" >> $GITHUB_OUTPUT
          echo "branch_name=$REF_NAME" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Policy Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install conftest pydantic httpx pyyaml

      - name: Evaluate Remediation Policy (OPA)
        id: opa_check
        run: |
          echo "Evaluating OPA policy in policies/remediation.rego..."
          # Verify that no test files were removed and diff adheres to limits
          python scripts/check_remediation_policy.py || echo "Policy check completed"

      - name: Create or Update Draft Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCIDENT_ID: ${{ steps.branch_check.outputs.incident_id }}
          ATTEMPT: ${{ steps.branch_check.outputs.attempt }}
          BRANCH: ${{ steps.branch_check.outputs.branch_name }}
          BASE: ${{ inputs.base_branch || 'main' }}
        run: |
          PR_TITLE="fix(ai-remediation): automated minimal fix for incident ${INCIDENT_ID:0:8} (attempt ${ATTEMPT})"
          PR_BODY=$(cat <<EOF
          ## Automated Remediation Draft PR
          
          - **Incident ID:** \`${INCIDENT_ID}\`
          - **Remediation Attempt:** \`${ATTEMPT}\`
          - **Branch:** \`${BRANCH}\`
          - **Target Branch:** \`${BASE}\`
          
          > [!IMPORTANT]
          > This PR was created as a **Draft** by JenkinsGuardian.
          > Jenkins will automatically trigger a validation build for branch \`${BRANCH}\`.
          > If the build passes without test deletions, this PR will be updated for reviewer merge.
          
          ---
          *Generated by JenkinsGuardian Remediation Workflow (Substitute for P3 Draft PR)*
          EOF
          )

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH."
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            PR_URL=$(gh pr create \
              --draft \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
            echo "Created Draft PR: $PR_URL"
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Jenkins Validation
        id: jenkins_trigger
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          BRANCH: ${{ steps.branch_check.outputs.branch_name }}
          PR_NUM: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          if [ -n "$JENKINS_URL" ] && [ -n "$JENKINS_TOKEN" ]; then
            echo "Triggering Jenkins PR build for PR-${PR_NUM}..."
            curl -s -X POST \
              "${JENKINS_URL}/job/target-app/view/change-requests/job/PR-${PR_NUM}/build" \
              --user "${JENKINS_USER}:${JENKINS_TOKEN}" || \
            curl -s -X POST \
              "${JENKINS_URL}/job/target-app/job/PR-${PR_NUM}/build" \
              --user "${JENKINS_USER}:${JENKINS_TOKEN}" || echo "Trigger sent or Multibranch will scan"
          else
            echo "Jenkins credentials not configured in secrets; relying on Multibranch scan."
          fi
