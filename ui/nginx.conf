map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self'; frame-ancestors 'self'" always;

  location /api/ {
    proxy_pass http://agent-api:8000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # Asks the API whether the session cookie is valid; 2xx lets the request through, 401 stops it.
  location = /_session_check {
    internal;
    proxy_pass http://agent-api:8000/api/v1/auth/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Grafana, embedded in the UI. Only signed-in UI users get through, and they all act as the one
  # read-only Grafana viewer: the header is set here, so anything the browser sends is overwritten.
  location /grafana/ {
    auth_request /_session_check;
    proxy_pass http://grafana:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-WEBAUTH-USER "ui-viewer";
    proxy_set_header Cookie "";
    proxy_read_timeout 60s;
    # Grafana needs inline scripts, so it gets its own headers instead of the app's strict CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
