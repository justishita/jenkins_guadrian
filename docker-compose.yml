services:

  rabbitmq:
    image: rabbitmq:3.13.7-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devnet

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devnet

  jenkins:
    build: ./jenkins
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "50000:50000"
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - devnet

  agent-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./common:/app/common
      - ./policies:/app/policies
      - ./data/evidence:/app/data/evidence
      - ./data/blackboard:/app/data/blackboard
      - ./data/reports:/app/data/reports:ro
      - ./monitoring/sql:/app/monitoring/sql:ro
    environment:
      # Tracing: set an OTLP endpoint (e.g. a Jaeger collector) to export spans, or OTEL_TRACES_CONSOLE=1 to print them.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_TRACES_CONSOLE=${OTEL_TRACES_CONSOLE:-0}
      # The UI only reads reports; the Coordinator is the one that writes them.
      - REPORTS_DIR=/app/data/reports
      - UI_TRUST_PROXY=true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - devnet

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - devnet

  ui:
    build:
      context: ./ui
    ports:
      - "3001:80"
    depends_on:
      - agent-api
      - grafana
    networks:
      - devnet

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      # Local only: the admin login. Everyone else reaches Grafana through the UI's /grafana/ proxy.
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Embedded in the UI under /grafana/. nginx only forwards signed-in UI users and sets the
      # X-WEBAUTH-USER header itself (a read-only Viewer), so Grafana trusts it (auth proxy).
      - GF_SERVER_ROOT_URL=http://localhost:3000/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_LIVE_ALLOWED_ORIGINS=http://localhost:3001
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      # Used by the provisioned Postgres (audit trail) datasource.
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devnet

  target-app:
    build:
      context: ./target_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - devnet

  opa:
    image: openpolicyagent/opa:0.68.0
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    healthcheck:
      test: ["CMD", "opa", "version"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - devnet

  code-agent:
    build:
      context: .
      dockerfile: agents/code_agent/Dockerfile
    restart: unless-stopped
    ports:
      - "9103:9103"
    environment:
      # Tracing: set an OTLP endpoint (e.g. a Jaeger collector) to export spans, or OTEL_TRACES_CONSOLE=1 to print them.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_CONSOLE: ${OTEL_TRACES_CONSOLE:-0}
      RABBITMQ_URL: ${RABBITMQ_URL}
      A2A_SHARED_TOKEN: ${A2A_SHARED_TOKEN}
      COORDINATOR_URL: http://coordinator:9100
      PORT: "9103"
      TRIGGER_MODE: ${TRIGGER_MODE:-a2a}
      EVIDENCE_DIR: /app/data/evidence
      BLACKBOARD_DIR: /app/data/blackboard
      AUDIT_DIR: /app/data/audit
      OPA_URL: http://opa:8181
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_OFFLINE: ${LLM_OFFLINE:-0}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      REPO_ROOT: /app
      TEST_COMMAND: "python -m pytest"
      TEST_TIMEOUT_SECONDS: "30"
    volumes:
      - ./data/evidence:/app/data/evidence
      - ./data/blackboard:/app/data/blackboard
      - ./data/audit:/app/data/audit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9103/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      opa:
        condition: service_healthy
    networks:
      - devnet

  jenkins-agent:
    build:
      context: .
      dockerfile: agents/jenkins_agent/Dockerfile
    restart: unless-stopped
    ports:
      - "9101:9101"
    environment:
      # Tracing: set an OTLP endpoint (e.g. a Jaeger collector) to export spans, or OTEL_TRACES_CONSOLE=1 to print them.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_CONSOLE: ${OTEL_TRACES_CONSOLE:-0}
      RABBITMQ_URL: ${RABBITMQ_URL}
      A2A_SHARED_TOKEN: ${A2A_SHARED_TOKEN}
      PORT: "9101"
      EVIDENCE_DIR: /app/data/evidence
      JENKINS_URL: http://jenkins:8080
      JENKINS_USER: ${JENKINS_USER}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_OFFLINE: ${LLM_OFFLINE:-0}
      ANALYTICS_MCP_URL: http://mcp-analytics:8082
    volumes:
      - ./data/evidence:/app/data/evidence
      - ./data/blackboard:/app/data/blackboard
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      jenkins:
        condition: service_healthy
    networks:
      - devnet

  metrics-agent:
    build:
      context: .
      dockerfile: agents/metrics_agent/Dockerfile
    restart: unless-stopped
    ports:
      - "9102:9102"
    environment:
      # Tracing: set an OTLP endpoint (e.g. a Jaeger collector) to export spans, or OTEL_TRACES_CONSOLE=1 to print them.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_CONSOLE: ${OTEL_TRACES_CONSOLE:-0}
      RABBITMQ_URL: ${RABBITMQ_URL}
      A2A_SHARED_TOKEN: ${A2A_SHARED_TOKEN}
      PORT: "9102"
      TRIGGER_MODE: ${TRIGGER_MODE:-a2a}
      DATABASE_URL: ${DATABASE_URL:-}
      EVIDENCE_DIR: /app/data/evidence
      PROMETHEUS_URL: http://prometheus:9090
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_OFFLINE: ${LLM_OFFLINE:-0}
      ANALYTICS_MCP_URL: http://mcp-analytics:8082
    volumes:
      - ./data/evidence:/app/data/evidence
      - ./data/blackboard:/app/data/blackboard
      - ./data/audit:/app/data/audit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - devnet

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      # Tracing: set an OTLP endpoint (e.g. a Jaeger collector) to export spans, or OTEL_TRACES_CONSOLE=1 to print them.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_CONSOLE: ${OTEL_TRACES_CONSOLE:-0}
      PORT: "9100"
      TRIGGER_MODE: ${TRIGGER_MODE:-a2a}
      DATABASE_URL: ${DATABASE_URL:-}
      AUDIT_DIR: /app/data/audit
      REPORTS_DIR: /app/data/reports
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
      A2A_SHARED_TOKEN: ${A2A_SHARED_TOKEN:?Set A2A_SHARED_TOKEN in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      JENKINS_AGENT_URL: http://jenkins-agent:9101
      METRICS_AGENT_URL: http://metrics-agent:9102
      CODE_AGENT_URL: http://code-agent:9103
    volumes:
      - ./data/blackboard:/app/data/blackboard
      - ./data/evidence:/app/data/evidence
      - ./data/audit:/app/data/audit
      - ./data/reports:/app/data/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      jenkins-agent:
        condition: service_healthy
    networks:
      - devnet

  mcp-jenkins:
    build:
      context: .
      dockerfile: mcp_servers/jenkins_mcp/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_USER: ${JENKINS_USER:?Set JENKINS_USER in .env}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:?Set JENKINS_API_TOKEN in .env}
      PORT: "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8081), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      jenkins:
        condition: service_healthy
    networks:
      - devnet

  mcp-analytics:
    build:
      context: .
      dockerfile: mcp_servers/analytics_mcp/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      # find_related_incidents reads earlier incidents' evidence from the Blackboard.
      BLACKBOARD_DIR: /app/data/blackboard
      # check_flakiness reads recent builds from Jenkins; without these it reports "unavailable".
      JENKINS_URL: http://jenkins:8080
      JENKINS_USER: ${JENKINS_USER:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
    volumes:
      - ./data/blackboard:/app/data/blackboard:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8082), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - devnet

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - devnet

volumes:
  postgres_data:
  jenkins_home:
  prometheus_data:
  grafana_data:

networks:
  devnet:
    name: devnet
    driver: bridge
